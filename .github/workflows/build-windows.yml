name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run package:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: school-erp-windows-installer
          path: |
            artifacts/*.exe
            artifacts/*.yml
          if-no-files-found: error
          retention-days: 14
